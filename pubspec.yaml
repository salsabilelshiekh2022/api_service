name: elmohtaref
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.6.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  ffi: ^2.0.0 
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.0.1
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  dartz: ^0.10.1
  equatable: ^2.0.7
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  get_it: ^8.0.3
  flutter_bloc: ^9.1.1
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^19.2.1
  internet_connection_checker: ^3.0.1
  requests_inspector: ^4.2.3
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  flutter_datetime_picker: ^1.5.1
  wheel_chooser: ^1.1.2
  restart_app: ^1.3.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  modal_progress_hud_nsn: ^0.5.1
  flutter_phoenix: ^1.1.1
  url_launcher: ^6.3.1
  dynamic_tabbar: ^1.0.9
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  hive_generator: ^2.0.0
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/translations/
    - assets/svgs/
    - assets/svgs/bell.svg
    - assets/images/
    - assets/fonts/
    - assets/icons/
    
flutter_assets:
  assets_path: assets/
  output_path: lib/generate/
  filename: app_assets.dart
  ignore_comments: true
  field_prefix: 
  classname: AppAssets    

 

  

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
       
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
